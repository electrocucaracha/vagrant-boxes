name: Continuous Integration
"on":
  push:
  pull_request:
permissions: read-all
jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      scripts: ${{ steps.filter.outputs.scripts }}
      docs: ${{ steps.filter.outputs.docs }}
      code: ${{ steps.functional-matrix.outputs.run_functional }}
      distros: ${{ steps.functional-matrix.outputs.distros }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # 6.4.0
        with:
          go-version: "^1.26"
          cache: false
      - name: Install dependencies
        run: go install github.com/boyter/scc/v3@latest
      - name: Run scc tool for counting lines of code
        run: scc --format wide
      # yamllint disable rule:line-length
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # 4.0.1
        # yamllint enable rule:line-length
        id: filter
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filters: |
            scripts:
              - '**.sh'
              - '.shellspec'
              - 'spec/**'
              - 'Makefile'
            docs:
              - '**/*.md'
              - 'docs/**'
            common:
              - 'build.sh'
              - 'generic-*.json'
              - 'http/generic.*'
              - 'scripts/common/**'
              - 'tpl/generic/**'
            ubuntu2204:
              - 'http/ubuntu2204/**'
              - 'http/ubuntu2204-utm/**'
              - 'scripts/ubuntu2204/**'
              - 'tpl/generic-ubuntu2204*.rb'
            ubuntu2404:
              - 'http/ubuntu2404/**'
              - 'http/ubuntu2404-utm/**'
              - 'scripts/ubuntu2404/**'
              - 'tpl/generic-ubuntu2404*.rb'
            ubuntu2604:
              - 'http/ubuntu2604/**'
              - 'http/ubuntu2604-utm/**'
              - 'scripts/ubuntu2604/**'
              - 'tpl/generic-ubuntu2604*.rb'
      - name: Build functional test matrix
        id: functional-matrix
        env:
          COMMON_CHANGED: ${{ steps.filter.outputs.common }}
          UBUNTU2204_CHANGED: ${{ steps.filter.outputs.ubuntu2204 }}
          UBUNTU2404_CHANGED: ${{ steps.filter.outputs.ubuntu2404 }}
          UBUNTU2604_CHANGED: ${{ steps.filter.outputs.ubuntu2604 }}
        run: |
          distros=()

          if [[ "${COMMON_CHANGED}" == "true" ]]; then
            distros=("ubuntu2204" "ubuntu2404" "ubuntu2604")
          else
            if [[ "${UBUNTU2204_CHANGED}" == "true" ]]; then
              distros+=("ubuntu2204")
            fi

            if [[ "${UBUNTU2404_CHANGED}" == "true" ]]; then
              distros+=("ubuntu2404")
            fi

            if [[ "${UBUNTU2604_CHANGED}" == "true" ]]; then
              distros+=("ubuntu2604")
            fi
          fi

          if [[ ${#distros[@]} -eq 0 ]]; then
            echo 'run_functional=false' >> "${GITHUB_OUTPUT}"
            echo 'distros=["ubuntu2204"]' >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          matrix_json=$(printf '%s\n' "${distros[@]}" | jq -R . | jq -s -c .)

          echo 'run_functional=true' >> "${GITHUB_OUTPUT}"
          echo "distros=${matrix_json}" >> "${GITHUB_OUTPUT}"
  check-shellspec:
    name: Run BDD shell specs
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          persist-credentials: false
      - name: Install ShellSpec
        run: >-
          curl -fsSL https://github.com/shellspec/shellspec/releases/latest/download/shellspec-dist.tar.gz | tar -xz -C ..
      - name: Run ShellSpec
        shell: 'script -q -e -c "bash {0}"'
        run: ../shellspec/shellspec --profile --xtrace
  check-broken-links:
    name: Check documentation external links
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          persist-credentials: false
      - name: Check broken links
        # yamllint disable rule:line-length
        uses: tcort/github-action-markdown-link-check@e7c7a18363c842693fadde5d41a3bd3573a7a225 # 1.1.2
  functional-test:
    name: Execute functional tests on self-hosted runner
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: vm-self-hosted
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        distro: ${{ fromJson(needs.changes.outputs.distros) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          persist-credentials: false
      - name: Install build prerequisites
        env:
          DISTRO: ${{ matrix.distro }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            jq \
            packer \
            coreutils \
            vagrant \
            virtualbox
      - name: Ensure packer plugins for virtualbox
        run: |
          packer plugins install github.com/hashicorp/vagrant
          packer plugins install github.com/hashicorp/virtualbox
      - name: Run build script
        env:
          DEBUG: true
          PROVIDERS: virtualbox
          DISTROS: ${{ matrix.distro }}
        run: ./build.sh
